<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="reset.css">
	<link rel="stylesheet" href="style.css">
	<title>WAR</title>
</head>

<body>
	<nav>
		<div id="nav-wrapper">
			<p id="remaining-cards"></p>
		</div>
	</nav>
	<header>
		<p id="subheading" class="subheading">LET'S<span class="break"><br></span>PLAY</p>
		<h1>WAR</h1>
	</header>
	<main>
		<h2 id="round-winner"></h2>
		<div id="players-wrapper">
			<div id="human" class="player">
				<p>human</p>
				<div class="card-slot">
					<img id="human-current-card" class="card-image" src="images/card_back.png" alt="human - current card" hidden />
				</div>
			</div>
			<div id="machine" class="player">
				<p>machine</p>
				<div class="card-slot">
					<img id="machine-current-card" class="card-image" src="images/card_back.png" alt="machine - current card" hidden />
				</div>
			</div>
		</div>
	</main>
	<footer id="button-wrapper">
			<button id="draw-two" class="btn hidden">Draw</button>
			<button id="new-deck" class="btn">start</button>
	</footer>
	<script src="index.js"></script>
</body>
</html>
